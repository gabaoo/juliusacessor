name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bunx tsc --noEmit

      - name: Run tests
        run: bunx vitest run

      - name: Build
        run: bun run build

  # Deploy runs only on pushes to main, after CI passes.
  # Lovable auto-deploys on push to the main branch; this job documents the flow
  # and is the hook point for any external host (e.g. Cloudflare, Vercel).
  deploy:
    needs: build-and-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy
        run: echo "Push to main detected — Lovable publishes automatically. Add host-specific deploy steps here if self-hosting."
